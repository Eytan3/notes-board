<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>לוח פתקים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&family=Assistant:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1c1a21; --bg2:#25222b; --ink:#26222c; --soft:#f3eee6; --muted:#9a94a3;
    --peach:#ffcfb8; --mint:#bfeedd; --lilac:#d9cdfb; --butter:#fbeaa5; --sky:#bde0fb; --rose:#fbc6d8;
    --r:18px;
    --butter-d:#4a4224; --peach-d:#4e3229; --mint-d:#1f4238; --lilac-d:#383055; --sky-d:#1f3c54; --rose-d:#4b2939;
    --nfg:#f3eee6; --ntool:#121016; --nfield:#ffffff12; --nhl:#ffffff14; --nedge:1px;
    --fg:#f3eee6; --ring:#f3eee6; --line:#ffffff1c; --hover:#302c37; --dot:#ffffff14; --rowbg:#ffffff0a;
    --accent:#ffcfb8; --danger:#ffb3b3; --glow1:#3a2f4a55; --glow2:#2c3d3a55;
    --toastbg:#f3eee6; --toastfg:#26222c; --sh:#000a;
  }
  [data-theme="light"]{
    --nfg:#26222c; --ntool:#26222c; --nfield:#ffffff55; --nhl:#ffffff70; --nedge:0px;
    --bg:#f5f0e8; --bg2:#ffffff; --muted:#7c7585;
    --fg:#26222c; --ring:#26222c; --line:#26222c1a; --hover:#efe8de; --dot:#26222c1c; --rowbg:#26222c0a;
    --accent:#e07b55; --danger:#c2412f; --glow1:#ffd9c755; --glow2:#cdeee355;
    --toastbg:#26222c; --toastfg:#f3eee6; --sh:#5a463a55;
  }
  body,header,.iconbtn,.sheet,.row{transition:background-color .3s, color .3s}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%}
  body{
    background:
      radial-gradient(1200px 600px at 85% -10%, var(--glow1), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, var(--glow2), transparent 60%),
      var(--bg);
    color:var(--fg); font-family:"Assistant",system-ui,sans-serif;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  body::before{ /* dot grid */
    content:"";position:fixed;inset:0;pointer-events:none;
    background-image:radial-gradient(var(--dot) 1px, transparent 1.2px);background-size:22px 22px;
  }
  header{
    position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;
    padding:18px max(clamp(16px,4vw,40px), calc((100% - 760px) / 2)) 14px;
    background:linear-gradient(var(--bg) 70%, transparent);
  }
  .brand{display:flex;align-items:baseline;gap:10px;flex:1;min-width:0}
  h1{font-family:"Rubik",sans-serif;font-weight:800;font-size:clamp(26px,5vw,38px);letter-spacing:-.03em;margin:0;line-height:1}
  h1 span{color:var(--accent)}
  .count{font-family:"Rubik",sans-serif;font-weight:500;color:var(--muted);font-size:15px;white-space:nowrap}
  .iconbtn{
    width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--bg2);color:var(--fg);
    display:grid;place-items:center;cursor:pointer;transition:transform .15s, background .15s;
  }
  .iconbtn:hover{background:var(--hover)}
  .iconbtn.small{width:40px;height:40px;border-radius:12px}
  .iconbtn.small svg{width:18px;height:18px}
  [data-theme="light"] .sun,:root:not([data-theme="light"]) .moon{display:none}
  .iconbtn:active{transform:scale(.94)}
  svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  main{padding:8px clamp(14px,4vw,40px) 120px}
  .board{
    position:relative;display:flex;flex-direction:column;gap:18px;
    max-width:760px;margin:0 auto;padding-inline-start:54px;
  }
  .board::before{ /* the sequence thread */
    content:"";position:absolute;inset-inline-start:20px;top:8px;bottom:8px;width:2px;border-radius:2px;
    background:linear-gradient(#ffcfb8,#d9cdfb 50%,#bfeedd);opacity:.35;
  }
  [data-theme="light"] .board::before{opacity:.9}
  [data-theme="light"] .note,[data-theme="light"] .swatch{--c:var(--cl)}

  .note{
    --cl:var(--butter); --cd:var(--butter-d); --c:var(--cd);
    position:relative;min-height:104px;padding:18px 20px;border-radius:var(--r);
    background:var(--c);color:var(--nfg);
    border:var(--nedge) solid color-mix(in srgb, var(--cl) 45%, transparent);
    box-shadow:0 1px 0 var(--nhl) inset, 0 10px 24px -10px var(--sh), 0 2px 4px #0003;
    cursor:pointer;user-select:none;touch-action:manipulation;
    transition:transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s;
    display:flex;flex-direction:column;
  }
  .note::after{ /* folded corner */
    content:"";position:absolute;left:0;bottom:0;width:26px;height:26px;
    background:linear-gradient(225deg, transparent 50%, #0000001a 50%);
    border-radius:0 0 0 var(--r);
  }
  .note:hover{transform:translateY(-2px)}
  .note.sel{transform:scale(1.01);box-shadow:0 0 0 3px var(--ring), 0 18px 34px -12px #000c;z-index:5}
  .note.editing{transform:none;box-shadow:0 0 0 3px var(--ring), 0 22px 40px -12px #000d;z-index:6;cursor:default}
  .idx{
    position:absolute;top:14px;inset-inline-start:-54px;width:42px;height:42px;border-radius:50%;
    display:grid;place-items:center;background:var(--cl);color:var(--ink);border:4px solid var(--bg);
    font-family:"Rubik",sans-serif;font-weight:700;font-size:14px;
    transition:transform .25s;
  }
  .text{
    font-size:17px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere;flex:1;
  }
  .text.empty{opacity:.45;font-style:italic}
  textarea{
    font:inherit;font-size:17px;line-height:1.45;color:var(--nfg);background:var(--nfield);border:0;outline:none;
    border-radius:10px;padding:8px 10px;width:100%;min-height:90px;resize:none;flex:1;
  }

  /* side rail on selected note (right side) */
  .note{transition:transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s, padding .22s, min-height .22s}
  .tools{
    position:absolute;inset-inline-start:10px;top:10px;width:52px;
    display:flex;flex-direction:column;align-items:center;gap:4px;padding:5px;border-radius:16px;background:var(--ntool);
    box-shadow:0 8px 20px -8px #000b;opacity:0;pointer-events:none;transform:translateX(8px);transition:.2s;z-index:8;
  }
  .note.sel{padding-inline-start:76px;padding-bottom:66px;min-height:150px}
  .note.sel .idx,.note.editing .idx{transform:scale(1.12);box-shadow:0 0 0 2px var(--ring)}
  .note.sel .tools,.note.sel .actions{opacity:1;pointer-events:auto;transform:none}
  .tools button{
    width:42px;height:38px;border-radius:11px;border:0;background:transparent;color:var(--soft);
    display:grid;place-items:center;cursor:pointer;padding:0;transition:background .15s;
  }
  .tools button:hover{background:#ffffff1a}
  .tools button:disabled{opacity:.25;cursor:default;background:transparent}
  .tools svg{width:20px;height:20px}
  .actions{
    position:absolute;inset-inline-end:12px;bottom:12px;display:flex;align-items:center;gap:14px;
    opacity:0;pointer-events:none;transform:translateY(6px);transition:.2s;z-index:8;
  }
  .actions button{border:0;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;padding:0}
  .a-edit{height:42px;padding:0 18px !important;border-radius:13px;background:var(--ntool);color:var(--soft);
    font:700 15px "Rubik",sans-serif;box-shadow:0 6px 16px -8px #000b}
  .a-edit svg{width:18px;height:18px}
  .a-edit:hover{filter:brightness(1.2)}
  .a-del{width:32px;height:32px;border-radius:10px;background:color-mix(in srgb, var(--nfg) 10%, transparent);color:var(--nfg);opacity:.75}
  .a-del svg{width:15px;height:15px}
  .a-del:hover{background:#d6453a;color:#fff;opacity:1}

  .editbar{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
  .swatch{--c:var(--cd);width:26px;height:26px;border-radius:50%;border:2px solid color-mix(in srgb, var(--nfg) 25%, transparent);cursor:pointer;padding:0;background:var(--c)}
  .swatch.on{border-color:var(--nfg);box-shadow:0 0 0 2px #ffffff66 inset}
  .done{
    margin-inline-start:auto;border:0;border-radius:999px;background:var(--nfg);color:var(--c);
    font:600 14px "Assistant",sans-serif;padding:9px 16px;cursor:pointer;display:flex;gap:6px;align-items:center;
  }
  .done svg{width:16px;height:16px}

  .fab{
    position:fixed;left:max(20px,env(safe-area-inset-left));bottom:max(22px,env(safe-area-inset-bottom));z-index:30;
    height:58px;padding:0 18px 0 22px;border-radius:20px;border:0;cursor:pointer;
    background:var(--peach);color:var(--ink);font:700 16px "Rubik",sans-serif;
    display:flex;align-items:center;gap:8px;box-shadow:0 14px 30px -10px #ffcfb880, 0 4px 10px #0006;
    transition:transform .15s;
  }
  .fab:active{transform:scale(.95)}
  .fab svg{stroke-width:2.6}

  .empty-state{margin-inline-start:-54px;text-align:center;padding:80px 20px;color:var(--muted)}
  .empty-state b{display:block;font-family:"Rubik",sans-serif;font-size:26px;color:var(--fg);margin-bottom:6px}

  .hint{max-width:760px;margin:0 auto 14px;color:var(--muted);font-size:13px}

  /* settings sheet */
  .scrim{position:fixed;inset:0;background:#0009;backdrop-filter:blur(3px);z-index:40;opacity:0;pointer-events:none;transition:.2s}
  .scrim.open{opacity:1;pointer-events:auto}
  .sheet{
    position:fixed;z-index:41;left:50%;bottom:0;width:min(440px,100%);transform:translate(-50%,105%);
    background:var(--bg2);border:1px solid var(--line);border-radius:24px 24px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));
    transition:transform .28s cubic-bezier(.2,.8,.2,1);
  }
  @media(min-width:600px){.sheet{bottom:auto;top:50%;border-radius:24px;transform:translate(-50%,-40%) scale(.96);opacity:0;pointer-events:none}
    .sheet.open{transform:translate(-50%,-50%) scale(1)!important;opacity:1;pointer-events:auto}}
  .sheet.open{transform:translate(-50%,0)}
  .sheet h2{font-family:"Rubik",sans-serif;font-size:22px;margin:0 0 14px}
  .row{
    width:100%;display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;border:0;margin-bottom:8px;
    background:var(--rowbg);color:var(--fg);font:500 15px "Assistant",sans-serif;cursor:pointer;text-align:start;
  }
  .row:hover{background:var(--hover)}
  .row small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
  .row .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none}
  a.row{text-decoration:none}
  #confirmSheet{text-align:center}
  .warn{width:56px;height:56px;margin:4px auto 12px;border-radius:18px;display:grid;place-items:center;background:var(--rose);color:#8a1f2d}
  .warn svg{width:26px;height:26px}
  .confirm-text{margin:-6px 0 20px;color:var(--muted);font-size:15px}
  .confirm-btns{display:flex;gap:10px}
  .confirm-btns button{flex:1;height:50px;border-radius:14px;border:0;font:700 16px "Rubik",sans-serif;cursor:pointer}
  .btn-cancel{background:var(--rowbg);color:var(--fg);border:1px solid var(--line)!important}
  .btn-danger{background:#d6453a;color:#fff}
  .btn-danger:hover{background:#c13a30}
  .preview{margin-top:6px;max-height:140px;overflow:auto;white-space:pre-wrap;font-size:13.5px;line-height:1.45;
    color:var(--muted);background:var(--rowbg);border-radius:12px;padding:10px 12px}
  .row.danger{color:var(--danger)}

  .toast{
    position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,20px);z-index:50;
    background:var(--toastbg);color:var(--toastfg);padding:10px 10px 10px 16px;border-radius:14px;font-weight:500;font-size:14px;
    display:flex;gap:10px;align-items:center;opacity:0;pointer-events:none;transition:.2s;box-shadow:0 10px 30px #0008;max-width:92vw
  }
  .toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
  .toast button{border:0;background:var(--accent);color:var(--ink);border-radius:9px;padding:7px 12px;font-weight:600;cursor:pointer}
  .toast button:empty{display:none}
</style>
</head>
<body>
<header>
  <div class="brand"><h1>לוח <span>פתקים</span></h1><span class="count" id="count"></span></div>
  <button class="iconbtn small" id="openShare" aria-label="שיתוף">
    <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>
  </button>
  <button class="iconbtn small" id="theme" aria-label="מצב כהה / בהיר">
    <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>
  <button class="iconbtn" id="openSettings" aria-label="הגדרות">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>
</header>

<main>
  <p class="hint">הקישו על פתק כדי להזיז אותו · הקשה כפולה לכתיבה</p>
  <div class="board" id="board"></div>
</main>

<button class="fab" id="add"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>פתק חדש</button>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="shareSheet" role="dialog" aria-label="שיתוף">
  <h2>שיתוף הפתקים</h2>
  <a class="row" id="shareWa" href="https://wa.me/" target="_blank" rel="noopener">
    <span class="ic" style="background:#25d366;color:#fff"><svg viewBox="0 0 24 24"><path d="M3.5 20.5l1.3-4.2A8.5 8.5 0 1 1 8 19.4z"/><path d="M9 9.5c0 3 2.5 5.5 5.5 5.5l1.3-1.4-2-1-1 .9a4 4 0 0 1-2.3-2.3l.9-1-1-2z" stroke-width="1.4"/></svg></span>
    <span>שלח הכול בוואטסאפ</span>
  </a>
  <button class="row" id="shareCopy">
    <span class="ic" style="background:var(--sky);color:var(--ink)"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg></span>
    <span>העתק את כל התוכן</span>
  </button>
</div>
<div class="sheet" id="confirmSheet" role="alertdialog" aria-label="אישור מחיקה">
  <div class="warn"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></div>
  <h2>למחוק את כל הפתקים?</h2>
  <p class="confirm-text" id="confirmText"></p>
  <div class="confirm-btns">
    <button class="btn-cancel" id="confirmNo">ביטול</button>
    <button class="btn-danger" id="confirmYes">כן, מחק הכול</button>
  </div>
</div>
<div class="sheet" id="sheet" role="dialog" aria-label="הגדרות">
  <h2>הגדרות</h2>
  <button class="row" id="exportTxt">
    <span class="ic" style="background:var(--mint);color:var(--ink)"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg></span>
    <span>ייצוא לקובץ טקסט (txt)<small>כל הפתקים לפי הסדר, בקובץ אחד</small></span>
  </button>
  <button class="row" id="copyAll">
    <span class="ic" style="background:var(--sky);color:var(--ink)"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg></span>
    <span>העתקת כל הטקסט<small>להדבקה בכל מקום</small></span>
  </button>
  <button class="row danger" id="clearAll">
    <span class="ic" style="background:var(--rose);color:var(--ink)"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></span>
    <span>מחיקת כל הפתקים</span>
  </button>
</div>

<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastBtn"></button></div>

<script>
const COLORS = ["butter","peach","mint","lilac","sky","rose"];
const KEY = "pinboard.notes.v1";
const $ = s => document.querySelector(s);
const board = $("#board");

/* theme */
const TKEY = "pinboard.theme";
function getTheme(){ try{ const t=localStorage.getItem(TKEY); if(t) return t; }catch(e){}
  return matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"; }
function setTheme(t){ document.documentElement.dataset.theme=t; try{ localStorage.setItem(TKEY,t); }catch(e){} }
document.documentElement.dataset.theme = getTheme();
$("#theme").addEventListener("click", ()=> setTheme(document.documentElement.dataset.theme==="light" ? "dark" : "light"));

/* sample notes */
function samples(){ return [
  {id:uid(), text:"ברוכים הבאים ללוח הפתקים ✦\n\nהקשה כפולה על פתק פותחת אותו לכתיבה, ו״סיום״ מחזיר לתצוגה.", color:"butter"},
  {id:uid(), text:"הקשה אחת על פתק פותחת חצים בצד ימין להזזה למעלה ולמטה.\nכפתורי העריכה והמחיקה נמצאים בפינה השמאלית התחתונה.", color:"mint"},
  {id:uid(), text:"״פתק חדש״ מוסיף פתק בסוף הרצף. אין הגבלה על מספר הפתקים, ובזמן עריכה אפשר לבחור צבע.", color:"peach"},
  {id:uid(), text:"כפתור השיתוף שולח את כל הפתקים לפי הסדר בוואטסאפ, או מעתיק אותם להדבקה בכל מקום.", color:"lilac"},
  {id:uid(), text:"☾ / ☀ מחליף בין מצב כהה לבהיר.\n⚙ בהגדרות: ייצוא לקובץ טקסט וניקוי הלוח.\n\nהכול נשמר אוטומטית במכשיר הזה.", color:"sky"},
]; }
/* replace older sample notes the user hasn't edited */
const OLD_SAMPLES = [
  "Welcome to your pinboard ✦\n\nDouble-tap me to edit.",
  "Tap a note and use the arrows to move it in the sequence.",
  "Export everything as .txt from ⚙ settings.",
  "ברוכים הבאים ללוח הפתקים ✦\n\nהקשה כפולה עליי לעריכה.",
  "הקישו על פתק והשתמשו בחצים כדי להזיז אותו ברצף.",
  "אפשר לייצא הכול לקובץ טקסט דרך ⚙ ההגדרות."
];

let notes = load();
notes.forEach(n=>{ if(n.text==="הקשה אחת על פתק פותחת סרגל קטן:\nחצים להזזה למעלה ולמטה ברצף, עריכה ומחיקה." || n.text==="הקשה אחת על פתק פותחת בצד ימין שלו:\nחצים להזזה למעלה ולמטה, כפתור עריכה גדול וכפתור מחיקה קטן." || n.text==="הקשה אחת על פתק פותחת בצד ימין שלו חצים להזזה למעלה ולמטה וכפתור עריכה.\nכפתור המחיקה נמצא בפינה השמאלית התחתונה.") n.text="הקשה אחת על פתק פותחת חצים בצד ימין להזזה למעלה ולמטה.\nכפתורי העריכה והמחיקה נמצאים בפינה השמאלית התחתונה."; });
if(notes.some(n=>OLD_SAMPLES.includes(n.text))){
  const firstIdx = notes.findIndex(n=>OLD_SAMPLES.includes(n.text));
  const kept = notes.filter(n=>!OLD_SAMPLES.includes(n.text));
  kept.splice(Math.min(firstIdx, kept.length), 0, ...samples());
  notes = kept; save();
}
let selected = null, editing = null;

function load(){
  try{ const d = JSON.parse(localStorage.getItem(KEY)); if(Array.isArray(d)) return d; }catch(e){}
  return samples();
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(notes)); }catch(e){} }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
const esc = s => s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

const ICON = {
  first:'<path d="M17 18l-5-5-5 5M17 11l-5-5-5 5"/>',
  left:'<path d="M18 15l-6-6-6 6"/>',
  right:'<path d="M6 9l6 6 6-6"/>',
  last:'<path d="M7 6l5 5 5-5M7 13l5 5 5-5"/>',
  edit:'<path d="M4 20h4L19 9l-4-4L4 16v4z"/>',
  del:'<path d="M4 7h16M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  check:'<path d="M5 12l5 5 9-10"/>'
};
const ic = n => `<svg viewBox="0 0 24 24">${ICON[n]}</svg>`;

function paint(el, c){ el.style.setProperty("--cl",`var(--${c})`); el.style.setProperty("--cd",`var(--${c}-d)`); }
function render(){
  const before = snapshot();
  board.innerHTML = "";
  $("#count").textContent = (notes.length===1 ? "פתק אחד" : notes.length + " פתקים");
  if(!notes.length){
    board.innerHTML = `<div class="empty-state"><b>לוח נקי.</b>לחצו על ״פתק חדש״ כדי להתחיל את הרצף.</div>`;
    return;
  }
  notes.forEach((n,i)=>{
    const el = document.createElement("div");
    el.className = "note" + (selected===n.id?" sel":"") + (editing===n.id?" editing":"");
    el.dataset.id = n.id;
    paint(el, n.color);
    const num = String(i+1).padStart(2,"0");
    if(editing===n.id){
      el.innerHTML = `<span class="idx">${num}</span>
        <textarea dir="auto" placeholder="כתבו משהו…">${esc(n.text)}</textarea>
        <div class="editbar">
          ${COLORS.map(c=>`<button class="swatch${c===n.color?" on":""}" data-color="${c}" style="--cl:var(--${c});--cd:var(--${c}-d)" aria-label="${c}"></button>`).join("")}
          <button class="done">${ic("check")}סיום</button>
        </div>`;
    } else {
      el.innerHTML = `<span class="idx">${num}</span>
        <div class="text${n.text.trim()?"":" empty"}" dir="auto">${n.text.trim()?esc(n.text):"הקשה כפולה לכתיבה…"}</div>
        <div class="tools">
          <button data-act="left" ${i===0?"disabled":""} aria-label="למעלה">${ic("left")}</button>
          <button data-act="right" ${i===notes.length-1?"disabled":""} aria-label="למטה">${ic("right")}</button>
        </div>
        <div class="actions">
          <button class="a-del" data-act="del" aria-label="מחיקה">${ic("del")}</button>
          <button class="a-edit" data-act="edit">${ic("edit")}עריכה</button>
        </div>`;
    }
    board.appendChild(el);
  });
  flip(before);
  if(editing){
    const ta = board.querySelector(".editing textarea");
    if(ta){ autosize(ta); ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
  }
}

/* smooth reordering (FLIP) */
function snapshot(){ const m={}; board.querySelectorAll(".note").forEach(e=>m[e.dataset.id]=e.getBoundingClientRect()); return m; }
function flip(before){
  board.querySelectorAll(".note").forEach(el=>{
    const a = before[el.dataset.id]; if(!a) return;
    const b = el.getBoundingClientRect(), dx=a.left-b.left, dy=a.top-b.top;
    if(!dx && !dy) return;
    el.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:getComputedStyle(el).transform}],{duration:320,easing:"cubic-bezier(.2,.8,.2,1)"});
  });
}
function autosize(ta){ ta.style.height="auto"; ta.style.height=ta.scrollHeight+"px"; }

function startEdit(id){ editing=id; selected=null; render(); }
function finishEdit(){
  if(!editing) return;
  const ta = board.querySelector(".editing textarea");
  const n = notes.find(x=>x.id===editing);
  if(n && ta) n.text = ta.value;
  editing=null; save(); render();
}
function move(id, act){
  const i = notes.findIndex(n=>n.id===id); if(i<0) return;
  const [n] = notes.splice(i,1);
  const j = act==="first"?0 : act==="last"?notes.length : act==="left"?i-1 : i+1;
  notes.splice(Math.max(0,Math.min(notes.length,j)),0,n);
  save(); render();
}

/* interactions */
let lastTap = {id:null,t:0};
board.addEventListener("click", e=>{
  const noteEl = e.target.closest(".note"); if(!noteEl) return;
  const id = noteEl.dataset.id;

  if(noteEl.classList.contains("editing")){
    const sw = e.target.closest(".swatch");
    if(sw){ const n=notes.find(x=>x.id===id); n.color=sw.dataset.color; paint(noteEl, n.color);
      noteEl.querySelectorAll(".swatch").forEach(s=>s.classList.toggle("on",s===sw)); save(); }
    if(e.target.closest(".done")) finishEdit();
    return;
  }
  const btn = e.target.closest(".tools button, .actions button");
  if(btn){
    const act = btn.dataset.act;
    if(act==="edit") startEdit(id);
    else if(act==="del") removeNote(id);
    else move(id, act);
    return;
  }
  const now = Date.now();
  if(lastTap.id===id && now-lastTap.t<350){ lastTap={id:null,t:0}; startEdit(id); return; }
  lastTap = {id, t:now};
  if(editing) finishEdit();
  selected = selected===id ? null : id;
  board.querySelectorAll(".note").forEach(el=>el.classList.toggle("sel", el.dataset.id===selected));
});
board.addEventListener("input", e=>{ if(e.target.tagName==="TEXTAREA") autosize(e.target); });
board.addEventListener("keydown", e=>{
  if(e.target.tagName!=="TEXTAREA") return;
  if(e.key==="Escape" || (e.key==="Enter" && (e.metaKey||e.ctrlKey))){ e.preventDefault(); finishEdit(); }
});
document.addEventListener("click", e=>{
  if(e.target.closest(".note,.fab,.sheet,#openSettings,.toast")) return;
  if(editing) finishEdit();
  if(selected){ selected=null; board.querySelectorAll(".note.sel").forEach(el=>el.classList.remove("sel")); }
});

$("#add").addEventListener("click", ()=>{
  if(editing) finishEdit();
  const last = notes[notes.length-1];
  const color = COLORS[(COLORS.indexOf(last?.color)+1) % COLORS.length] || "butter";
  const n = {id:uid(), text:"", color};
  notes.push(n); save(); startEdit(n.id);
  requestAnimationFrame(()=>board.querySelector(".editing")?.scrollIntoView({behavior:"smooth",block:"center"}));
});

/* delete with undo */
let undo = null;
function removeNote(id){
  const i = notes.findIndex(n=>n.id===id);
  const [n] = notes.splice(i,1); selected=null; save(); render();
  undo = ()=>{ notes.splice(i,0,n); save(); render(); };
  toast("הפתק נמחק", "ביטול");
}

/* toast */
let tt;
function toast(msg, action){
  $("#toastMsg").textContent = msg; $("#toastBtn").textContent = action||"";
  $("#toast").classList.add("show"); clearTimeout(tt);
  tt = setTimeout(()=>{ $("#toast").classList.remove("show"); undo=null; }, 4500);
}
$("#toastBtn").addEventListener("click", ()=>{ if(undo){ undo(); undo=null; } $("#toast").classList.remove("show"); });

/* settings */
function openSheet(o, id="#sheet"){
  document.querySelectorAll(".sheet").forEach(el=>el.classList.toggle("open", o && el.matches(id)));
  $("#scrim").classList.toggle("open",o);
}
function shareText(){
  return `*לוח פתקים* · ${notes.length} פתקים\n\n` +
    notes.map((n,i)=>`*${i+1}.* ${n.text.trim()||"(ריק)"}`).join("\n\n");
}
$("#openShare").addEventListener("click", ()=>{
  if(editing) finishEdit();
  if(!notes.length){ toast("אין עדיין פתקים לשתף"); return; }
  const t = shareText();
  $("#shareWa").href = "https://wa.me/?text=" + encodeURIComponent(t);
  openSheet(true, "#shareSheet");
});
$("#shareWa").addEventListener("click", e=>{
  if($("#shareWa").href.length > 60000){ e.preventDefault(); toast("הטקסט ארוך מדי לוואטסאפ — השתמשו בהעתקה"); return; }
  setTimeout(()=>openSheet(false), 200);
});
$("#shareCopy").addEventListener("click", async ()=>{
  openSheet(false);
  try{ await navigator.clipboard.writeText(shareText()); toast("כל התוכן הועתק"); }
  catch(e){ toast("לא ניתן להעתיק כאן"); }
});
$("#openSettings").addEventListener("click", ()=>{ if(editing) finishEdit(); openSheet(true); });
$("#scrim").addEventListener("click", ()=>openSheet(false));
document.addEventListener("keydown", e=>{ if(e.key==="Escape") openSheet(false); });

function asText(){
  const d = new Date().toLocaleString("he-IL");
  return `לוח פתקים — ${notes.length} פתקים — יוצא בתאריך ${d}\n\n` +
    notes.map((n,i)=>`#${i+1}\n${n.text.trim()||"(ריק)"}`).join("\n\n— — —\n\n") + "\n";
}
let downloads = null;
if(window.claude?.use) window.claude.use("downloads").then(d=>downloads=d).catch(()=>{});
$("#exportTxt").addEventListener("click", async ()=>{
  const name = `notes-${new Date().toISOString().slice(0,10)}.txt`;
  const data = asText();
  openSheet(false);
  if(downloads){
    try{ await downloads.save({filename:name, data}); toast("הקובץ נשמר: "+name); }
    catch(e){ toast("הייצוא בוטל"); }
    return;
  }
  try{
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([data],{type:"text/plain"}));
    a.download = name; document.body.appendChild(a); a.click(); a.remove();
    toast("הקובץ נשמר: "+name);
  }catch(e){ toast("הייצוא נחסם — נסו את העתקת כל הטקסט"); }
});
$("#copyAll").addEventListener("click", async ()=>{
  openSheet(false);
  try{ await navigator.clipboard.writeText(asText()); toast("הועתק ללוח"); }
  catch(e){ toast("לא ניתן להעתיק כאן"); }
});
$("#clearAll").addEventListener("click", ()=>{
  if(!notes.length){ openSheet(false); toast("הלוח כבר ריק"); return; }
  $("#confirmText").textContent = notes.length===1 ? "הפתק היחיד בלוח יימחק מהמכשיר." : `כל ${notes.length} הפתקים יימחקו מהמכשיר.`;
  openSheet(true, "#confirmSheet");
});
$("#confirmNo").addEventListener("click", ()=>openSheet(false));
$("#confirmYes").addEventListener("click", ()=>{
  const backup = notes; notes=[]; selected=editing=null; save(); render(); openSheet(false);
  undo = ()=>{ notes=backup; save(); render(); };
  toast("כל הפתקים נמחקו", "ביטול");
});
render();
</script>
</body>
</html>
